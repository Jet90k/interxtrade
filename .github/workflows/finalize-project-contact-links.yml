name: Finalize project and contact flows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-flows:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch localized project and contact links
        shell: python
        run: |
          import re
          from pathlib import Path

          cfg = {
            'it': {
              'project_file': 'progetti.html', 'contact_file': 'contatti.html',
              'shop': 'https://shop.interxtrade.eu/it',
              'project': 'https://shop.interxtrade.eu/it/invia-progetto',
              'rfq': 'https://shop.interxtrade.eu/it/richiesta-offerta',
              'project_cta': 'INVIA PROGETTO →',
              'contact_alt': 'Per una richiesta strutturata usa lo Shop B2B',
              'contact_alt_cta': 'RICHIEDI UN’OFFERTA →',
            },
            'de': {
              'project_file': 'de-progetti.html', 'contact_file': 'de-contatti.html',
              'shop': 'https://shop.interxtrade.eu/de',
              'project': 'https://shop.interxtrade.eu/de/invia-progetto',
              'rfq': 'https://shop.interxtrade.eu/de/richiesta-offerta',
              'project_cta': 'PROJEKT SENDEN →',
              'contact_alt': 'Für eine strukturierte Anfrage nutzen Sie den B2B-Shop',
              'contact_alt_cta': 'ANGEBOT ANFRAGEN →',
            },
            'en': {
              'project_file': 'en-progetti.html', 'contact_file': 'en-contatti.html',
              'shop': 'https://shop.interxtrade.eu/en',
              'project': 'https://shop.interxtrade.eu/en/invia-progetto',
              'rfq': 'https://shop.interxtrade.eu/en/richiesta-offerta',
              'project_cta': 'SEND PROJECT →',
              'contact_alt': 'For a structured request use the B2B Shop',
              'contact_alt_cta': 'REQUEST A QUOTE →',
            },
            'al': {
              'project_file': 'al-progetti.html', 'contact_file': 'al-contatti.html',
              'shop': 'https://shop.interxtrade.eu/al',
              'project': 'https://shop.interxtrade.eu/al/invia-progetto',
              'rfq': 'https://shop.interxtrade.eu/al/richiesta-offerta',
              'project_cta': 'DËRGO PROJEKTIN →',
              'contact_alt': 'Për një kërkesë të strukturuar përdorni Shop B2B',
              'contact_alt_cta': 'KËRKO OFERTË →',
            },
          }

          for lang, c in cfg.items():
            p = Path(c['project_file'])
            text = p.read_text(encoding='utf-8')
            text = text.replace('https://shop.interxtrade.eu"', c['shop'] + '"')
            text = re.sub(
              r'(<section class="ctaBand"><div class="wrap"><h2>.*?</h2>)<a href="[^"]*">.*?</a>',
              lambda m: m.group(1) + f'<a href="{c["project"]}">{c["project_cta"]}</a>',
              text, count=1, flags=re.S,
            )
            p.write_text(text, encoding='utf-8')

            p = Path(c['contact_file'])
            text = p.read_text(encoding='utf-8')
            text = text.replace('https://shop.interxtrade.eu"', c['shop'] + '"')
            text = re.sub(
              r'<p class="formalt">.*?</p>',
              f'<p class="formalt">{c["contact_alt"]} <a href="{c["rfq"]}">{c["contact_alt_cta"]}</a></p>',
              text, count=1, flags=re.S,
            )
            p.write_text(text, encoding='utf-8')

      - name: Commit launch flow fixes
        run: |
          if git diff --quiet -- '*progetti.html' '*contatti.html'; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *progetti.html *contatti.html
          git commit -m "launch: connect project and contact flows to B2B shop"
          git push
