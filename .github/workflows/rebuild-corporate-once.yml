name: Rebuild corporate site once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate corporate site
        run: python scripts/rebuild_corporate.py
      - name: Commit final corporate site
        run: |
          rm -f .github/workflows/rebuild-corporate-once.yml
          rm -f scripts/rebuild_corporate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "launch: finalize corporate copy logo and localization"
          git push
